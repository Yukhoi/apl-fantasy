version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: apl_fantasy_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: apl_user
      POSTGRES_PASSWORD: apl_password
      POSTGRES_DB: apl_fantasy
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: